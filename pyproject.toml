[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-health-checker"
version = "0.1.0"
description = "OpenBIM IFC Model Health Checker and COBie Validator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ifcopenshell>=0.7.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[project.scripts]
ifc-checker = "ifc_checker.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ifc_checker.reporters" = ["*.html"]
